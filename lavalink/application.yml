server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "youshallnotpass"
    sources:
      youtube: true
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    # Higher buffer = fewer underruns on weak hosts (latency tradeoff)
    bufferDurationMs: 700
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 20
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    # Opus quality path is fixed by Discord; keep node healthy
    trackStuckThresholdMs: 10000

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  level:
    root: INFO
    lavalink: INFO
